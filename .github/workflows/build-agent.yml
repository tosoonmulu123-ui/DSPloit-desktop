name: Build DSPloit Agent

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build-agent:
    runs-on: macos-15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show Xcode version
        run: |
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-path
          xcrun --sdk iphoneos --show-sdk-version

      - name: Install ldid
        run: brew install ldid

      - name: Build Agent (arm64e)
        working-directory: agent
        run: make ARCH=arm64e

      - name: Verify binary exists
        run: |
          echo "=== Searching for agent binary ==="
          find . -name "dsploit_agent*" -type f
          ls -la payloads/ || true
          file payloads/dsploit_agent_arm64e || true

      - name: Upload agent binary
        uses: actions/upload-artifact@v4
        with:
          name: dsploit-agent
          path: payloads/dsploit_agent_*

      - name: Upload build logs (on failure)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs-failed
          path: agent/*.log
          if-no-files-found: ignore

  build-python:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Verify all Python files compile
        run: |
          python -m py_compile main.py
          python -m py_compile compile.py
          find src -name "*.py" -exec python -m py_compile {} \;
          echo "All Python files OK"
